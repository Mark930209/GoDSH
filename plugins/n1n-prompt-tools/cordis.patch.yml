- insert:
    - id: n1n-prompt-tools
      name: 'dsh-n1n-prompt-tools'
      config:
        enabled: true
        # 硬限制：只有 n1n 供应商会走文本工具协议。
        # 这里写任何其它 provider 都会被插件丢弃（代码里过滤为只保留 'n1n'），
        # 空数组表示"什么都不生效"，不存在"空数组=全部生效"的开关。
        providers: ['n1n']
        # 可选白名单：只有列出的模型走文本协议。空数组 = n1n 下所有模型都试。
        # 一般不需要填，交给下面的 autoDetect 自动判断即可。
        models: []
        # 可选黑名单：列出的模型永远走原生 tools，优先级高于 models。
        # 已知不适用文本协议的模型（实测 2026-11-05）：
        #   glm-5.3   —— 输出残缺 `<tool_call>read  file_path="..."</arg_value>`
        #   kimi-k3   —— 直接返回空内容
        # 想彻底避开就把它们填进来；但 autoDetect 已经能自动降级，通常留空即可。
        denyModels: []
        # 自动检测（默认开）：某模型回复里出现了工具调用语法却没能解析成调用，
        # 立刻把该 供应商/模型 降级为原生 tools，本进程后续不再改写它。
        # 这就是"能提升缓存的就用文本协议，不能的就自动退回原生"。设 false 则关闭。
        autoDetect: true
        # 兜底（默认开）：如果某个请求没有 tools 字段（说明工具已被摘掉），
        # 但实际请求走的是别的 provider，仍然解析它的回复，避免"漏出标记然后
        # 整轮停住"。它只把文本转成调用，不会摘任何 provider 的 tools。
        parseStrippedRoutes: true
        marker: '@@TOOL@@'
