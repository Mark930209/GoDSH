name: Validate plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate changed plugins (pull request)
        if: github.event_name == 'pull_request'
        run: node scripts/validate-plugins.mjs --since "origin/${{ github.base_ref }}"

      - name: Validate all plugins
        if: github.event_name != 'pull_request'
        run: node scripts/validate-plugins.mjs
