name: Release plugin

on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve plugin from tag
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          plugin="${tag%-v*}"
          version="${tag##*-v}"
          if [ ! -d "plugins/$plugin" ]; then
            echo "::error::tag $tag 没有对应的插件目录 plugins/$plugin"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Remove superseded 1.x releases
        if: steps.meta.outputs.version == '1.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The plugin's numbering was reset to 1.0.0 at the user's request.
          # Remove the abandoned 1.1.0 / 1.2.0 releases and their tags once.
          gh release delete file-tree-context-menu-v1.1.0 --yes --cleanup-tag || true
          gh release delete file-tree-context-menu-v1.2.0 --yes --cleanup-tag || true

      - name: Validate plugin
        run: node scripts/validate-plugins.mjs --plugin "${{ steps.meta.outputs.plugin }}"

      - name: Verify package version matches tag
        run: |
          version=$(node -p "require('./plugins/${{ steps.meta.outputs.plugin }}/package.json').version")
          if [ "$version" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::package.json 版本 $version 与 tag 不一致"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.plugin }} v${{ steps.meta.outputs.version }}
          generate_release_notes: true

      - name: Refresh market index
        run: |
          # The tag commit may be behind main (docs commits land after a local
          # release), so refresh the index on top of the latest main instead
          # of pushing the detached tag commit over it.
          # make-market-index.mjs 只收录"有发布 tag"的插件，并把每个插件的 commit
          # 钉在它自己的 tag 上，所以这里不需要也不应该传 --commit（否则会把其他
          # 未发布插件指向 HEAD）。
          #
          # Every command that can fail reports WHY through a GitHub annotation:
          # job logs need authentication, annotations are public, so a red run
          # carries its own diagnosis.
          fail() {
            printf '::error::%s: %s\n' "$1" "$(tr '\n' ' ' < "$2" | cut -c1-1600)"
            exit 1
          }

          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags --force \
            > /tmp/fetch.log 2>&1 || fail "git fetch failed" /tmp/fetch.log
          git checkout -B main origin/main > /tmp/checkout.log 2>&1 \
            || fail "checkout main failed" /tmp/checkout.log

          node scripts/make-market-index.mjs > /tmp/index.log 2>&1 \
            || fail "make-market-index failed" /tmp/index.log
          tail -n 5 /tmp/index.log

          if git diff --quiet -- docs/market-index.json; then
            echo "市场索引无变化"
            exit 0
          fi
          echo "索引有变化，准备提交："
          git diff --stat -- docs/market-index.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/market-index.json
          git commit -m "chore: refresh market index for ${{ steps.meta.outputs.tag }} [skip ci]" \
            > /tmp/commit.log 2>&1 || fail "git commit failed" /tmp/commit.log

          # A plain push can race a human push to main; retry once on the
          # rebased head before giving up, and always surface the reason.
          if ! git push origin HEAD:main > /tmp/push.log 2>&1; then
            git fetch origin +refs/heads/main:refs/remotes/origin/main --force \
              > /tmp/fetch2.log 2>&1 || fail "git fetch (retry) failed" /tmp/fetch2.log
            git rebase origin/main > /tmp/rebase.log 2>&1 \
              || { git rebase --abort || true; fail "git rebase failed" /tmp/rebase.log; }
            git push origin HEAD:main > /tmp/push2.log 2>&1 \
              || fail "git push failed" /tmp/push2.log
          fi
          echo "已把刷新后的索引推回 main"
