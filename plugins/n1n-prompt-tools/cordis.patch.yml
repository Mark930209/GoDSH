- insert:
    - id: n1n-prompt-tools
      name: 'dsh-n1n-prompt-tools'
      config:
        enabled: true
        # 硬限制：只有 n1n 供应商会走文本工具协议。
        # 这里写任何其它 provider 都会被插件丢弃（代码里过滤为只保留 'n1n'），
        # 空数组表示"什么都不生效"，不存在"空数组=全部生效"的开关。
        providers: ['n1n']
        # 可选：再按模型收窄。空数组 = n1n 下所有模型。
        # 注意 n1n 里 glm-5.3 不遵循文本协议，需要它时把这里设为
        # models: ['deepseek-v4.1-flash'] 之类的白名单。
        models: []
        marker: '@@TOOL@@'
